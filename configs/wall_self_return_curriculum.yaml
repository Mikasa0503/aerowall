# Observable ballistic receiving reference with bounded-reference home fallback.
# HCSP-inspired recovery diagnostic with an observable receiving reference.
# Development reward-balance alternative: a single wall leg followed by failure has negative sparse return.
# Same physical task and full-rally score; no global attitude restriction.
wall_fixture:
  center: [1.0, 0.0, 3.0]
  dimensions: [0.2, 4.0, 6.0]
  restitution: 0.8
  align_cap_to_visual_top: true
wall_task:
  targets_yz: [[0.0, 1.8]]
  target_radius: 0.35
  bounds_low: [-2.5, -1.8, 0.08]
  bounds_high: [1.1, 1.8, 5.5]
  outbound_leg_reward: 0.0
  rally_reward: 100.0
  target_reward: 0.0
  failure_penalty: 20.0
  launch_reward: 5.0
  launch_mode: self_return
  launch_flight_time: 0.35
  launch_velocity_scale: [1.5, 1.5, 2.0]
  recovery_reference: ballistic
  recovery_restitution_prior: 0.8
  phase_recovery_weight: 3.0
  recovery_home_position: [0.0, 0.0, 1.0]
  intercept_weight: 1.0
  smoothness_weight: 0.05

  return_contact_position: [0.0, 0.0, 1.123]
  return_flight_time: 1.0
